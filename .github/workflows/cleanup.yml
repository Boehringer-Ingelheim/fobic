---
name: Cleanup container images

# Prunes old GHCR versions per stream so the package doesn't grow unbounded.
#
# Requires either:
#   - the GHCR package "fobic" has "Manage Actions access" set to grant this
#     repo the Admin role (lets the default GITHUB_TOKEN delete versions), or
#   - a repo secret PACKAGE_CLEANUP_TOKEN: a classic PAT with the
#     read:packages + delete:packages scopes, used as a fallback below.

on:
  schedule:
    - cron: "30 3 * * *" # Daily at 03:30 UTC
  workflow_dispatch:

env:
  IMAGE_NAME: fobic

permissions:
  contents: read
  packages: read

jobs:
  cleanup-stable:
    name: Cleanup stable-* versions
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      # This action is not yet pinned to a commit SHA; Renovate will open an
      # automerging "pin" PR to convert this to a digest, matching this repo's
      # convention for other third-party actions.
      - name: Delete old stable-* versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: ${{ env.IMAGE_NAME }}
          package-type: container
          min-versions-to-keep: 2
          ignore-versions: "^(?!stable).*$"
          token: ${{ secrets.PACKAGE_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}

  cleanup-latest:
    name: Cleanup latest-* versions
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Delete old latest-* versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: ${{ env.IMAGE_NAME }}
          package-type: container
          min-versions-to-keep: 2
          ignore-versions: "^(?!latest).*$"
          token: ${{ secrets.PACKAGE_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}

  cleanup-untagged:
    name: Cleanup untagged manifests
    # Deletes GHCR versions with no tag pointing to them anymore (e.g. old
    # manifests left behind when tag-images moves a stream tag to a new
    # build, or orphaned intermediate/multi-arch layers). Since nothing
    # references them, they're pure storage waste, so all of them are
    # removed instead of keeping N like the tagged-stream jobs above.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Delete untagged versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: ${{ env.IMAGE_NAME }}
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: true
          token: ${{ secrets.PACKAGE_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}

  cleanup-ephemeral-branches:
    name: Cleanup feat-* and fix-* versions for deleted branches
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Delete feat-* and fix-* versions whose branch no longer exists
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          IMAGE_NAME_LC="${IMAGE_NAME,,}"
          ORG_LC="${REPO%%/*}"
          ORG_LC="${ORG_LC,,}"

          # Ephemeral branches have one canonical tag (feat-{branch} or
          # fix-{branch}) plus dated and SHA aliases. Only canonical tags can
          # be used to determine whether a branch still exists.
          declare -A active_ephemeral_tags=()
          while IFS= read -r branch; do
            prefix="${branch%%/*}"
            active_ephemeral_tags["${prefix}-${branch#*/}"]=1
          done < <(
            gh api --paginate "/repos/${REPO}/branches?per_page=100" \
              --jq '.[] | .name' |
              while IFS= read -r branch; do
                [[ "${branch}" == feat/* || "${branch}" == fix/* ]] &&
                  printf '%s\n' "${branch}"
              done
          )

          gh api --paginate --slurp \
            "/orgs/${ORG_LC}/packages/container/${IMAGE_NAME_LC}/versions?per_page=100" |
          jq -c '.[][]' | while read -r version; do
            id=$(jq -r '.id' <<<"${version}")
            has_ephemeral_tag=false
            has_active_ephemeral_tag=false

            while IFS= read -r tag; do
              [[ "${tag}" == feat-* || "${tag}" == fix-* ]] || continue
              has_ephemeral_tag=true
              if [[ -n "${active_ephemeral_tags[${tag}]+x}" ]]; then
                has_active_ephemeral_tag=true
              fi
            done < <(jq -r '.metadata.container.tags[]? // empty' <<<"${version}")

            if [[ "${has_ephemeral_tag}" == true &&
              "${has_active_ephemeral_tag}" == false ]]; then
              echo "No matching ephemeral branch exists, deleting version ${id}"
              gh api -X DELETE \
                "/orgs/${ORG_LC}/packages/container/${IMAGE_NAME_LC}/versions/${id}"
            fi
          done
