name: Feature request
description: Suggest a new feature or improvement for the project
title: ""
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please share as much detail as possible so we can evaluate the request.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What problem, workflow gap, or user need are you trying to address?
      placeholder: Describe the current pain point or limitation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see added or changed?
      placeholder: Describe the desired behavior, workflow, or capability.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you tried any workarounds or considered other approaches?
      placeholder: Describe any alternatives or current workarounds.

  - type: textarea
    id: impact
    attributes:
      label: Expected impact
      description: Who benefits from this and how does it improve the project or user experience?
      placeholder: Explain the expected value and affected users.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include links, screenshots, examples, references, or anything else that would help evaluation.
      placeholder: Add any relevant context, examples, or references.

  - type: checkboxes
    id: verification
    attributes:
      label: Confirmation
      options:
        - label: I searched for an existing issue and this is not a duplicate
          required: true
        - label: I understand this is a feature request rather than a bug report
          required: true
